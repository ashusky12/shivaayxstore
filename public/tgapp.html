<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShivaayXStore Web App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background-color: #0b0e14; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0;">
  <div style="text-align: center;">
    <h2>⏳ Loading...</h2>
  </div>

  <script>
    // As soon as the Web App opens, immediately send /start and close the overlay
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.sendData('/start');
    } else {
      document.body.innerHTML = "<h2>Open inside Telegram client</h2>";
    }
  </script>
</body>
</html>
